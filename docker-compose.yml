services:
  nfcapd:
    build:
      context: .
      args:
        NFDUMP_VERSION: "1.7.7"
    container_name: nfcapd
    restart: unless-stopped
    ports:
      - "12345:12345/udp"
    environment:
      TZ: Europe/Warsaw
      FLOW_DIR: /flows
      PORT: "12345"
      SUBDIR_FORMAT: "1"
      ROTATE_INTERVAL: "300"
    volumes:
      - ./nfcapd/data:/flows

  nfcapd-retention:
    build:
      context: .
      args:
        NFDUMP_VERSION: "1.7.7"
    container_name: nfcapd-retention
    restart: unless-stopped
    command: ["/cleanup.sh"]
    environment:
      TZ: Europe/Warsaw
      FLOW_DIR: /flows
      SLEEP_SECONDS: "3600"
    volumes:
      - ./nfcapd/data:/flows

  nfcapd-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: nfcapd-monitor
    restart: "no"
    environment:
      TZ: Europe/Warsaw
      FLOW_DIR: /flows
      NTFY_URL: "${NTFY_URL:-}"
      FILE_AGE_THRESHOLD: "${FILE_AGE_THRESHOLD:-15}"
      DISK_THRESHOLD: "${DISK_THRESHOLD:-90}"
      CHECK_INTERVAL: "${CHECK_INTERVAL:-300}"
      HOSTNAME_LABEL: "${HOSTNAME_LABEL:-}"
    volumes:
      - ./nfcapd/data:/flows