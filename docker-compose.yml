services:
  nfcapd:
    build:
      context: .
      args:
        NFDUMP_VERSION: "${NFDUMP_VERSION:-1.7.7}"
    container_name: nfcapd
    restart: unless-stopped
    ports:
      - "${PORT:-12345}:${PORT:-12345}/udp"
    environment:
      TZ: "${TZ:-Europe/Warsaw}"
      FLOW_DIR: "${FLOW_DIR:-/flows}"
      PORT: "${PORT:-12345}"
      SUBDIR_FORMAT: "${SUBDIR_FORMAT:-1}"
      ROTATE_INTERVAL: "${ROTATE_INTERVAL:-300}"
    volumes:
      - "${DATA_DIR:-./nfcapd/data}:${FLOW_DIR:-/flows}"

  nfcapd-retention:
    build:
      context: .
      args:
        NFDUMP_VERSION: "${NFDUMP_VERSION:-1.7.7}"
    container_name: nfcapd-retention
    restart: unless-stopped
    command: ["/cleanup.sh"]
    environment:
      TZ: "${TZ:-Europe/Warsaw}"
      FLOW_DIR: "${FLOW_DIR:-/flows}"
      SLEEP_SECONDS: "${RETENTION_SLEEP:-3600}"
    volumes:
      - "${DATA_DIR:-./nfcapd/data}:${FLOW_DIR:-/flows}"

  nfcapd-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: nfcapd-monitor
    restart: "no"
    environment:
      TZ: "${TZ:-Europe/Warsaw}"
      FLOW_DIR: "${FLOW_DIR:-/flows}"
      NTFY_URL: "${NTFY_URL:-}"
      FILE_AGE_THRESHOLD: "${FILE_AGE_THRESHOLD:-15}"
      DISK_THRESHOLD: "${DISK_THRESHOLD:-90}"
      CHECK_INTERVAL: "${CHECK_INTERVAL:-300}"
      HOSTNAME_LABEL: "${HOSTNAME_LABEL:-}"
    volumes:
      - "${DATA_DIR:-./nfcapd/data}:${FLOW_DIR:-/flows}"
